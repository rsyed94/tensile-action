name: Jiffy gate
description: Decide which tests this change runs, as one step inside the test job (phase select) or as its own job. Fails closed to running everything.
author: Jiffy

inputs:
  phase:
    description: 'The in-job selection step: select (inside the test job, before the test command; outputs args for the runner) or outcome (after it: judges the decision against the test report). Empty runs the separate-job gate or the evidence modes.'
    required: false
    default: ''
  runner:
    description: 'phase select: the test runner the args are for: vitest, jest, node-test or pytest.'
    required: false
    default: 'vitest'
  root:
    description: "phase select: the runner's working directory relative to the repo (a package in a monorepo); args are relative to it."
    required: false
    default: ''
  test-paths:
    description: "phase select: where this runner's test files live, as path prefixes (`*` is one segment), one per line. Default: anywhere."
    required: false
    default: ''
  map-signature:
    description: "phase select: the map's signature (the JSON of the service's GET /v1/ledger/maps/:owner/:repo/:sha/signature: {claims, signature}), as a path or https URL. Default: the map path plus .sig.json. Unsigned maps only feed shadow proposals; a wrong signature runs everything."
    required: false
    default: ''
  history:
    description: 'phase select: recent test failures from the ledger, a JSON array of {file, failedAt}. Only adds tests.'
    required: false
    default: ''
  max-map-commits:
    description: 'phase select: maps whose commit is more than this many commits behind the base are stale and run everything.'
    required: false
    default: '200'
  policy-files:
    description: 'phase select: more files whose change runs everything (the workflow running the step and the Tensile config always do), one per line.'
    required: false
    default: ''
  check-run-id:
    description: "phase select: the job's id, as job.check_run_id in an expression. The ledger decision's subject, so the control room can join it to the job's timings."
    required: false
    default: ''
  test-step:
    description: 'phase select: the name of the step that runs the tests; the control room scales its duration by the skipped share.'
    required: false
    default: ''
  report:
    description: "phase select (post hook) or outcome: the runner's test report(s), Vitest/Jest JSON or JUnit XML, one per line. The outcome counts a miss for any failing test selection skipped."
    required: false
    default: ''
  test-outcome:
    description: 'phase outcome: steps.<test>.outcome, so a failed test step whose report lists no failure reads unknown. Required by quarantine-mode enforce.'
    required: false
    default: ''
  quarantine-mode:
    description: "phase outcome: the flaky-test quarantine override. shadow (default) records whether every failure was a quarantined test on the service's signed list, and never changes the job's result. enforce makes this step carry the job's result (give the test step continue-on-error: true and pass test-outcome): it passes a failed test job only when every failing test is quarantined for this job's environment, the reports are complete JUnit XML written in this job, the list is fresh and verified, the event is a pull_request, and the service enabled the override for the repo; anything else keeps the job red. The test step must run only the reporting runner (no coverage threshold, no other command) and list every report. off does neither."
    required: false
    default: 'shadow'
  upload-results:
    description: "phase outcome: send each test's result and duration to the ledger (service-url, OIDC). false turns it off."
    required: false
    default: 'true'
  map:
    description: Coverage map (.bin.gz) as a path or an http(s) URL. Missing, unreadable or stale -> run everything.
    required: false
    default: ''
  base:
    description: Git revision to diff against (merge-based with HEAD). Default from the event (PR base, or the default branch on pushes).
    required: false
    default: ''
  durations:
    description: 'Vitest/Jest JSON report or {"file": seconds} JSON. Defines the full test list and balances shards.'
    required: false
    default: ''
  mode:
    description: 'The gate: report (default; everything still runs, the summary shows what would be skipped) or enforce. phase select: shadow (the default when empty) or enforce, which takes effect only when the service enabled it for the repo, the map verified and the ledger is fresh.'
    required: false
    default: ''
  matrix:
    description: Strategy matrix as JSON. Pruned to one combination per push; full on merge_group and default-branch pushes.
    required: false
    default: ''
  shards:
    description: 'The gate: shards to balance the tests across (by measured duration, longest first onto the lightest shard), or auto: the fewest that finish within shard-target-minutes while billed minutes stay within shard-cost-cap. docs/design/sharding.md.'
    required: false
    default: '1'
  shard-target-minutes:
    description: 'shards auto: the wall time to finish the tests within (default 10).'
    required: false
    default: ''
  shard-max:
    description: 'shards auto: the most shards to use (default 16).'
    required: false
    default: ''
  shard-cost-cap:
    description: "shards auto: billed minutes may grow to at most this multiple of one job's (default 1.5)."
    required: false
    default: ''
  shard-setup-seconds:
    description: "Seconds each extra shard's job spends before the tests (checkout, install), for auto and the outcome's sharding projection (default 60)."
    required: false
    default: ''
  shard:
    description: 'phase select: this leg of a static shard matrix, like "2/4" (pass matrix.shard). shard-args then holds the runner''s own flag for this leg''s share of the full run; the slice of the selection it would run is recorded in shadow. A sharded leg never enforces.'
    required: false
    default: ''
  run-all:
    description: Kill switch. Anything other than false/0/empty runs everything (so does env JIFFY_RUN_ALL).
    required: false
    default: 'false'
  max-map-age-days:
    description: Maps recorded longer ago than this are stale and run everything. 0 turns the check off.
    required: false
    default: '14'
  timeout-seconds:
    description: Time budget for the decision; past it, everything runs.
    required: false
    default: '60'
  sample-rate:
    description: 'Share of skipped tests that run anyway as a check (R14), like 5% or 0.05; at least one when anything is skipped. Seeded by the commit. 0 turns it off.'
    required: false
    default: '5%'
  quarantine:
    description: 'Quarantine list (`jiffy flaky list --json`, or the state file) of flaky tests (R13). On pushes that select, quarantined test files go to the quarantined output instead of tests, to run apart from the fast check; never at merge. Unreadable means quarantine nothing.'
    required: false
    default: ''
  always:
    description: Test path prefixes that are never skipped, one per line or comma-separated (e.g. the selector's own tests).
    required: false
    default: ''
  decision-file:
    description: "phase select and outcome: where the decision file goes (default $RUNNER_TEMP/tensile/selection-decision.json). The gate: also write the decision (the service's DecisionPayload: selected with reasons, sampled, skipped) to this JSON file, for later steps such as `jiffy misses`."
    required: false
    default: ''
  service-url:
    description: 'Jiffy service (https). When set, the map (unless `map` is given) and the kill switch come from it and every decision is posted to it, authenticated with an OIDC token (needs `permissions: id-token: write`). Any service failure runs everything.'
    required: false
    default: ''
  working-directory:
    description: Git checkout to diff. Default the workspace.
    required: false
    default: ''
  evidence:
    description: 'What the step does: false (default) runs the gate; start begins the evidence job (right after checkout, before the install: writes a placeholder record and reads git); true runs the evidence step after the install (needs no permissions or secrets; writes the file in the `file` output for an artifact); upload sends those artifacts to `service-url` (the jiffy-upload job, with id-token: write).'
    required: false
    default: 'false'
  matrix-key:
    description: "Evidence step and phase select: the job's matrix, as toJSON(matrix) in an expression, so each leg writes its own file (and the selection decision names its job)."
    required: false
    default: ''
  evidence-dir:
    description: 'Evidence step: where to write the file (default $RUNNER_TEMP/jiffy-evidence). Upload: where the downloaded artifacts are (default jiffy-evidence).'
    required: false
    default: ''
  token:
    description: "Evidence start: a token for its git fetches (the default branch's jiffy.yml), for a checkout with persist-credentials: false. Pass github.token to this step only; no other step needs it."
    required: false
    default: ''
  evidence-sha256:
    description: "Upload: the evidence job's sha256 output (or 'none'). Each evidence file must match it, or it isn't uploaded and Jiffy shows that evidence as unavailable. Unset, files are uploaded unchecked."
    required: false
    default: ''

outputs:
  run-all:
    description: "'true' or 'false'. Treat anything other than 'false' (including empty) as true."
  args:
    description: 'phase select: the selected tests as shell-quoted arguments for the runner (vitest run $ARGS, jest $ARGS, node --test $ARGS, pytest $ARGS). Empty when run-all; an empty args runs the whole suite.'
  files:
    description: 'phase select: the selected test files relative to root, one per line.'
  count:
    description: 'phase select: how many test files args lists.'
  skip:
    description: "phase select: 'true' when enforcing and the change selects no test at all; skip the test command then. Never 'true' in shadow."
  mode:
    description: 'phase select: the mode in effect, shadow or enforce.'
  decision-file:
    description: 'phase select: the decision file written (for phase outcome).'
  record-file:
    description: 'phase outcome: the ledger records (tensile.selection-record): the smart_execution decision and its outcome. With service-url and id-token: write, also sent to the service (POST /v1/ledger/selection-records), which records it as a claim.'
  verdict:
    description: 'phase outcome: correct, miss or unknown.'
  missed:
    description: 'phase outcome: failing test files selection skipped (or would have), as a JSON array.'
  reason:
    description: Why everything runs, when it does.
  tests:
    description: Test files to run (selected plus sampled) as a JSON array; empty when run-all.
  tests-lines:
    description: The same test files as tests (selected plus sampled), one per line.
  sampled:
    description: Skipped tests that run anyway as a check (R14), as a JSON array. They are also in tests and shards; a failure among them is a miss.
  quarantined:
    description: Quarantined test files (R13) to run apart from the fast check, as a JSON array; not in tests. Under run-all, exclude them from the main run. Always [] at merge.
  shards:
    description: 'JSON array of {index, total, label, tests, seconds}, label like "1/4". Under run-all tests is empty: shard with the runner''s --shard=label.'
  shard-plan:
    description: 'The gate: the shard count and why, as JSON ({n, choice, why, basis, estimated: {wallSeconds, billedMinutes, unshardedWallSeconds, unshardedBilledMinutes}, ...}). Estimates from past durations, not measurements.'
  shard-args:
    description: "phase select with shard: the runner's own flag for this leg's share of the full run (vitest/jest --shard=2/4, node --test-shard=2/4, pytest-jiffy --jiffy-shard=2/4). Empty when run-all is false or shard is unset or invalid: then the leg runs everything."
  matrix:
    description: 'The matrix to run as JSON: one combination in axes form ({"os": ["ubuntu-latest"]}) or the full input.'
  file:
    description: 'Evidence step: absolute path of the jiffy-evidence-<job>-<matrix>.json it wrote; empty when it skipped (not a pull request, or one from a fork).'
  artifact:
    description: 'Evidence step: the artifact name to upload the file under; empty when it skipped.'
  status:
    description: 'Evidence step: the advisory status (the service recomputes it), or skipped / unavailable.'
  sha256:
    description: "Evidence start and step: the sha256 of the file as last written. Expose it as a job output for the upload's evidence-sha256."

runs:
  using: node24
  main: dist/index.js
  # Only the in-job selection step does anything here (its outcome, when given `report`); every other mode exits.
  post: dist/index.js
  post-if: always()
